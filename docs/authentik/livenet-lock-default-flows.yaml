# Blocks Authentik's own flows that LiveNet replaces or doesn't use, so the only way to do these things
# is through the LiveNet flows (which ask for the current password and confirm by email):
#
#   default-password-change, default-user-settings-flow   change a password, username, email or name
#   default-authenticator-webauthn-setup                  Authentik's own passkey setup (ours requires a
#                                                         discoverable credential, so sign-in can offer it)
#   default-source-enrollment                             creating a new account from a Google, Discord or
#                                                         GitHub sign-in (accounts are only ever LINKED)
#   initial-setup, default-request                        first-run admin setup, and access requests
#   default-enrollment-flow                               the old signup flow, replaced by livenet-invited-signup
#
# Anyone who opens these flows directly (even by typing the address) gets "Access denied". Admins
# can still change a user from the Authentik admin interface. Import as a blueprint (see docs/signin.md).
version: 1
metadata:
  name: LiveNet - Lock the default account-change flows
entries:
  - model: authentik_policies_expression.expressionpolicy
    id: deny-all
    identifiers:
      name: livenet-deny-default-account-flows
    attrs:
      expression: |
        ak_message("Please change this on your LiveNet account page: livenet.host/account")
        return False

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-password-change]]
      policy: !KeyOf deny-all
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      policy: !KeyOf deny-all
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  # ---- Flows LiveNet doesn't use or replaces --------------------------------
  - model: authentik_policies_expression.expressionpolicy
    id: deny-generic
    identifiers:
      name: livenet-deny-unused-flows
    attrs:
      expression: |
        ak_message("This isn't available.")
        return False

  - model: authentik_policies_expression.expressionpolicy
    id: deny-social-signup
    identifiers:
      name: livenet-deny-social-signup
    attrs:
      expression: |
        ak_message("No LiveNet account is linked to this sign-in. Sign in with your LiveNet username and password, then link it from your account page at livenet.host/account.")
        return False

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
      policy: !KeyOf deny-all
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      policy: !KeyOf deny-social-signup
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, initial-setup]]
      policy: !KeyOf deny-generic
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-request]]
      policy: !KeyOf deny-generic
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  # The old signup flow, replaced by livenet-invited-signup. Make sure the identification stage's
  # "Enrollment flow" points at the new one BEFORE importing this, or the "Sign up" link is denied too.
  - model: authentik_policies_expression.expressionpolicy
    id: deny-old-signup
    identifiers:
      name: livenet-deny-old-signup
    attrs:
      expression: |
        ak_message("This signup link is out of date. Go to auth.livenet.host and choose Sign up there.")
        return False

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-enrollment-flow]]
      policy: !KeyOf deny-old-signup
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30
