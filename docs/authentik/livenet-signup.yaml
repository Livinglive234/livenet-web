# LiveNet's own signup flow, used by everyone: the Sign up link, invitations, and old panel accounts being
# moved over. Import as a blueprint (see docs/signin.md, "Signup").
#
# The invitation email links here with "?email=<their address>". This flow:
#   - prefills the Email field with that address,
#   - refuses a different address when the link carries one (the panel matches accounts by email, so a
#     different address would not get their servers),
#   - refuses an address another LiveNet account already uses,
#   - asks for a username (lowercase, for SFTP), an optional name and a password (at least 10 characters, and
#     not found in a known data breach),
#   - sends the usual confirmation email, then signs the person in.
#
# After importing, bind your Captcha stage to this flow at order 5 (Flows > livenet-signup > Stage
# Bindings), like on the default enrollment flow. The user-write, email and login stages are shared with
# default-enrollment-flow, so changes to those apply to both.
version: 1
metadata:
  name: LiveNet - Signup
entries:
  - model: authentik_flows.flow
    id: invite-flow
    identifiers:
      slug: livenet-signup
    attrs:
      name: LiveNet signup
      title: Create your LiveNet account
      designation: enrollment
      authentication: none

  - model: authentik_policies_expression.expressionpolicy
    id: invite-username-policy
    identifiers:
      name: livenet-signup-username
    attrs:
      expression: |
        import re
        username = (request.context.get("prompt_data") or {}).get("username", "")
        # Lowercase letters, digits, dot, dash and underscore; starts and ends with a letter or digit.
        # (The panel looks usernames up in lowercase, so capitals would break SFTP.)
        if not re.fullmatch(r"[a-z0-9][a-z0-9_.-]{1,30}[a-z0-9]", username):
            ak_message("Usernames are 3 to 32 characters: lowercase letters, numbers, dots, dashes and underscores. They must start and end with a letter or number.")
            return False
        return True

  - model: authentik_policies_expression.expressionpolicy
    id: invite-name-policy
    identifiers:
      name: livenet-signup-name
    attrs:
      expression: |
        import re
        name = ((request.context.get("prompt_data") or {}).get("name") or "").strip()
        if not name:
            return True
        if len(name) > 100:
            ak_message("Your name must be 100 characters or fewer.")
            return False
        # Names that look official are refused (people who run LiveNet can change theirs later).
        reserved = {"admin", "administrator", "staff", "mod", "moderator", "livenet", "support", "owner", "system", "root", "official", "team"}
        words = set(re.findall(r"[a-z0-9]+", name.lower()))
        squashed = re.sub(r"[^a-z0-9]", "", name.lower())
        if words & reserved or squashed in reserved:
            ak_message("That name looks like an official LiveNet name. Please pick another.")
            return False
        return True

  - model: authentik_policies_expression.expressionpolicy
    id: invite-email-policy
    identifiers:
      name: livenet-signup-email
    attrs:
      expression: |
        from urllib.parse import parse_qs
        from authentik.core.models import User

        email = ((request.context.get("prompt_data") or {}).get("email") or "").strip().lower()
        if not email:
            return False

        # The address from the invitation link, if there is one.
        invited = ""
        try:
            http = request.http_request
            stored = http.session.get("authentik/flows/get") or {}
            invited = str(stored.get("email", "") or "")
            if not invited:
                invited = (parse_qs(http.GET.get("query", "")).get("email") or [""])[0]
        except Exception:
            invited = ""
        invited = invited.strip().lower()

        if invited and email != invited:
            ak_message("This invitation is for " + invited + ". Please use that email address.")
            return False
        if User.objects.filter(email__iexact=email).exists():
            ak_message("A LiveNet account with that email address already exists. Sign in instead.")
            return False
        return True

  - model: authentik_policies_expression.expressionpolicy
    id: invite-password-policy
    identifiers:
      name: livenet-signup-password
    attrs:
      expression: |
        data = request.context.get("prompt_data") or {}
        password = data.get("password", "")
        if len(password) < 10:
            ak_message("Use at least 10 characters.")
            return False
        username = (data.get("username") or "").lower()
        email = (data.get("email") or "").lower()
        if password.lower() in (username, email):
            ak_message("Your password can't be your username or email.")
            return False
        return True

  # Refuses a password that has appeared in a known data breach (checked against Have I Been Pwned, which is
  # free and never sees the password: only the first five characters of its hash are sent).
  - model: authentik_policies_password.passwordpolicy
    id: invite-breach-policy
    identifiers:
      name: livenet-signup-breach
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 10
      check_have_i_been_pwned: true
      hibp_allowed_count: 0
      check_zxcvbn: false
      error_message: That password is too short or has appeared in a data breach. Please choose another.

  - model: authentik_stages_prompt.prompt
    id: invite-username-field
    identifiers:
      name: livenet-signup-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Choose a username
      placeholder_expression: false
      order: 100

  - model: authentik_stages_prompt.prompt
    id: invite-name-field
    identifiers:
      name: livenet-signup-field-name
    attrs:
      field_key: name
      label: Your name (optional)
      type: text
      required: false
      placeholder: Your name
      placeholder_expression: false
      order: 101

  # Prefilled from the "?email=" in the invitation link. If it can't be read, the field is simply empty.
  - model: authentik_stages_prompt.prompt
    id: invite-email-field
    identifiers:
      name: livenet-signup-field-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: you@example.com
      placeholder_expression: false
      order: 102
      initial_value: |
        from urllib.parse import parse_qs
        try:
            # "request" here wraps the real web request, which is request.http_request.
            http = request.http_request
            stored = http.session.get("authentik/flows/get") or {}
            value = str(stored.get("email", "") or "")
            if not value:
                value = (parse_qs(http.GET.get("query", "")).get("email") or [""])[0]
            return value.strip()[:200]
        except Exception:
            return ""
      initial_value_expression: true

  - model: authentik_stages_prompt.prompt
    id: invite-password-field
    identifiers:
      name: livenet-signup-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 103

  - model: authentik_stages_prompt.prompt
    id: invite-password-repeat-field
    identifiers:
      name: livenet-signup-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Repeat the password
      placeholder_expression: false
      order: 104

  - model: authentik_policies_expression.expressionpolicy
    id: invite-terms-policy
    identifiers:
      name: livenet-signup-terms
    attrs:
      expression: |
        data = request.context.get("prompt_data") or {}
        if data.get("terms") is not True:
            ak_message("Please confirm you are 13 or older and agree to the Terms and Privacy Policy.")
            return False
        return True

  - model: authentik_stages_prompt.prompt
    id: invite-terms-text
    identifiers:
      name: livenet-signup-field-terms-text
    attrs:
      field_key: terms_text
      label: Terms
      type: static
      required: false
      placeholder: >-
        <a href="https://livenet.host/terms/" target="_blank" rel="noopener">Terms of Service</a> and
        <a href="https://livenet.host/privacy/" target="_blank" rel="noopener">Privacy Policy</a>.
        You must be 13 or older to have an account. LiveNet Server Hosting requires you to be 18 or older.
      placeholder_expression: false
      order: 105

  - model: authentik_stages_prompt.prompt
    id: invite-terms-field
    identifiers:
      name: livenet-signup-field-terms
    attrs:
      field_key: terms
      label: I am 13 or older and I agree to the Terms and Privacy Policy
      type: checkbox
      required: true
      placeholder: ""
      placeholder_expression: false
      order: 106

  - model: authentik_stages_prompt.promptstage
    id: invite-prompt
    identifiers:
      name: livenet-signup-prompt
    attrs:
      fields:
        - !KeyOf invite-username-field
        - !KeyOf invite-name-field
        - !KeyOf invite-email-field
        - !KeyOf invite-password-field
        - !KeyOf invite-password-repeat-field
        - !KeyOf invite-terms-text
        - !KeyOf invite-terms-field
      validation_policies:
        - !KeyOf invite-username-policy
        - !KeyOf invite-name-policy
        - !KeyOf invite-email-policy
        - !KeyOf invite-password-policy
        - !KeyOf invite-breach-policy
        - !KeyOf invite-terms-policy

  - model: authentik_flows.flowstagebinding
    identifiers: {order: 10, stage: !KeyOf invite-prompt, target: !KeyOf invite-flow}
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-enrollment-user-write]]
      target: !KeyOf invite-flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 30
      stage: !Find [authentik_stages_email.emailstage, [name, default-enrollment-email-verification]]
      target: !KeyOf invite-flow
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 100
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-enrollment-user-login]]
      target: !KeyOf invite-flow
