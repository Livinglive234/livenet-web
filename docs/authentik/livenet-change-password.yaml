# A flow that lets a signed-in person change their own password, safely. Import as a blueprint
# (see docs/signin.md, "Changing a password").
#
#   livenet-change-password   1. asks for the CURRENT password,
#                             2. emails a confirmation link to the account's address,
#                             3. once the link is clicked, asks for the new password (twice) and saves it.
#
# It finishes on https://livenet.host/account. Change that address below if the site lives elsewhere.
version: 1
metadata:
  name: LiveNet - Change password
entries:
  - model: authentik_flows.flow
    id: password-flow
    identifiers:
      slug: livenet-change-password
    attrs:
      name: LiveNet change password
      title: Change your password
      designation: stage_configuration
      authentication: require_authenticated

  # A flow opened straight from a link has no "pending user", which the password and email stages insist
  # on, so set it to the signed-in person just before the first stage runs.
  - model: authentik_policies_expression.expressionpolicy
    id: password-pending-user-policy
    identifiers:
      name: livenet-change-password-pending-user
    attrs:
      expression: |
        plan = request.context["flow_plan"]
        plan.context["pending_user"] = request.user
        return True

  - model: authentik_policies_expression.expressionpolicy
    id: password-strength-policy
    identifiers:
      name: livenet-change-password-strength
    attrs:
      expression: |
        password = (request.context.get("prompt_data") or {}).get("password", "")
        if len(password) < 10:
            ak_message("Use at least 10 characters.")
            return False
        if password.lower() in (request.user.username.lower(), (request.user.email or "").lower()):
            ak_message("Your password can't be your username or email.")
            return False
        return True

  # 1. Current password
  - model: authentik_stages_password.passwordstage
    id: password-current
    identifiers:
      name: livenet-change-password-current
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  # 2. Confirmation email to the account's own address
  - model: authentik_stages_email.emailstage
    id: password-verify
    identifiers:
      name: livenet-change-password-verify
    attrs:
      use_global_settings: true
      template: email/password_reset.html
      subject: Confirm your LiveNet password change
      activate_user_on_success: false

  # 3. New password, twice
  - model: authentik_stages_prompt.prompt
    id: password-field
    identifiers:
      name: livenet-change-password-field
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: New password
      placeholder_expression: false
      order: 100

  - model: authentik_stages_prompt.prompt
    id: password-repeat-field
    identifiers:
      name: livenet-change-password-repeat-field
    attrs:
      field_key: password_repeat
      label: New password (repeat)
      type: password
      required: true
      placeholder: Repeat the new password
      placeholder_expression: false
      order: 101

  - model: authentik_stages_prompt.promptstage
    id: password-prompt
    identifiers:
      name: livenet-change-password-prompt
    attrs:
      fields:
        - !KeyOf password-field
        - !KeyOf password-repeat-field
      validation_policies:
        - !KeyOf password-strength-policy

  - model: authentik_stages_user_write.userwritestage
    id: password-write
    identifiers:
      name: livenet-change-password-write
    attrs:
      user_creation_mode: never_create

  - model: authentik_stages_redirect.redirectstage
    id: password-redirect
    identifiers:
      name: livenet-change-password-redirect
    attrs:
      mode: static
      target_static: https://livenet.host/account
      keep_context: false

  - model: authentik_flows.flowstagebinding
    id: password-current-binding
    identifiers: {order: 10, stage: !KeyOf password-current, target: !KeyOf password-flow}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers: {order: 20, stage: !KeyOf password-verify, target: !KeyOf password-flow}
  - model: authentik_flows.flowstagebinding
    identifiers: {order: 30, stage: !KeyOf password-prompt, target: !KeyOf password-flow}
  - model: authentik_flows.flowstagebinding
    identifiers: {order: 40, stage: !KeyOf password-write, target: !KeyOf password-flow}
  - model: authentik_flows.flowstagebinding
    identifiers: {order: 50, stage: !KeyOf password-redirect, target: !KeyOf password-flow}

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf password-current-binding
      policy: !KeyOf password-pending-user-policy
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30
